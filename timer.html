<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c0e;
      --surface: #161618;
      --text: #e8e8ea;
      --text-dim: #5a5a68;
      --blue: #5b8af0;
      --amber: #f0a050;
      --red: #e05555;
      --ring-track: #1c1c20;
      --ring-color: #5b8af0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1rem, 3vh, 2rem);
      padding: 2rem;
    }

    .label {
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* ── Ring ── */
    .ring-wrap {
      position: relative;
      width: min(60vw, 60vh, 420px);
      aspect-ratio: 1;
    }

    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: var(--ring-track);
      stroke-width: 10;
    }

    .ring-progress {
      fill: none;
      stroke: var(--ring-color);
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.95s linear, stroke 0.6s ease;
    }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .time-text {
      font-size: clamp(2.8rem, 10vmin, 5rem);
      font-weight: 300;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      transition: color 0.6s ease;
    }

    .status-text {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-dim);
      min-height: 1em;
      transition: color 0.4s ease;
    }

    /* ── Input ── */
    .input-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .time-input {
      width: 3.4ch;
      background: var(--surface);
      border: 1px solid #222226;
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 1.4rem;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      text-align: center;
      padding: 0.35rem 0.1rem;
      outline: none;
      -moz-appearance: textfield;
      appearance: textfield;
      transition: border-color 0.15s;
    }

    .time-input::-webkit-inner-spin-button,
    .time-input::-webkit-outer-spin-button { display: none; }

    .time-input:focus { border-color: var(--blue); }

    .time-sep {
      font-size: 1.4rem;
      font-weight: 300;
      color: var(--text-dim);
      line-height: 1;
      margin-bottom: 0.1rem;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      border: none;
      cursor: pointer;
      font-family: inherit;
      border-radius: 8px;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      transition: filter 0.15s, transform 0.1s, opacity 0.2s;
    }

    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.35; pointer-events: none; }

    .btn-primary {
      background: var(--blue);
      color: #fff;
      padding: 0.7rem 2.2rem;
      transition: background 0.4s ease, filter 0.15s;
    }

    .btn-primary:hover { filter: brightness(1.15); }

    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
      padding: 0.7rem 1.1rem;
      border: 1px solid #222226;
    }

    .btn-ghost:hover { color: var(--text); border-color: #3a3a42; }

    /* ── Sound toggle ── */
    .sound-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      cursor: pointer;
      user-select: none;
    }

    .toggle {
      width: 30px;
      height: 17px;
      background: #2a2a32;
      border-radius: 9px;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .toggle.on { background: var(--blue); }

    .toggle::after {
      content: '';
      position: absolute;
      width: 13px;
      height: 13px;
      background: #fff;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.2s;
    }

    .toggle.on::after { transform: translateX(13px); }

    /* ── Notification banner ── */
    .notif {
      position: fixed;
      top: 1.2rem;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: var(--surface);
      border: 1px solid #2a2a32;
      border-radius: 20px;
      padding: 0.5rem 1.4rem;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      white-space: nowrap;
    }

    .notif.show { transform: translateX(-50%) translateY(0); }

    /* ── Pulse animation ── */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .pulsing { animation: pulse 1.2s ease-in-out infinite; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="label">Presentation Timer</div>

  <div class="ring-wrap">
    <svg class="ring-svg" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <filter id="soft-glow">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <circle class="ring-track" cx="100" cy="100" r="88"/>
      <circle class="ring-progress" id="ring" cx="100" cy="100" r="88" filter="url(#soft-glow)"/>
    </svg>
    <div class="ring-center">
      <div class="time-text" id="timeDisplay">00:00</div>
      <div class="status-text" id="statusText"></div>
    </div>
  </div>

  <div id="setupRow">
    <div class="input-row">
      <input class="time-input" id="inputMin" type="number" min="0" max="99" value="10" inputmode="numeric" aria-label="Minutes">
      <span class="time-sep">:</span>
      <input class="time-input" id="inputSec" type="number" min="0" max="59" value="00" inputmode="numeric" aria-label="Seconds">
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-ghost hidden" id="btnReset" aria-label="Reset">Reset</button>
    <button class="btn btn-primary" id="btnStart" aria-label="Start timer">Start</button>
    <button class="btn btn-ghost hidden" id="btnPause" aria-label="Pause timer">Pause</button>
  </div>

  <label class="sound-row" aria-label="Toggle sounds">
    <div class="toggle on" id="toggle" role="switch" aria-checked="true"></div>
    <span class="label">Sounds</span>
  </label>

  <div class="notif" id="notif" role="status" aria-live="polite"></div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────
    let totalSec = 0;
    let remaining = 0;
    let timerId = null;
    let running = false;
    let soundOn = true;
    let wakeLock = null;
    let halfFired = false;
    let fiveFired = false;

    // ── DOM ────────────────────────────────────────────────────────────────
    const ring       = document.getElementById('ring');
    const timeDisp   = document.getElementById('timeDisplay');
    const statusTxt  = document.getElementById('statusText');
    const btnStart   = document.getElementById('btnStart');
    const btnPause   = document.getElementById('btnPause');
    const btnReset   = document.getElementById('btnReset');
    const setupRow   = document.getElementById('setupRow');
    const inputMin   = document.getElementById('inputMin');
    const inputSec   = document.getElementById('inputSec');
    const toggleEl   = document.getElementById('toggle');
    const notif      = document.getElementById('notif');

    const CIRC = 2 * Math.PI * 88; // r = 88
    ring.style.strokeDasharray = CIRC;
    setRingFraction(1); // start full

    // ── Audio ──────────────────────────────────────────────────────────────
    let ctx = null;

    function getCtx() {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function chime(freq, startAt, duration = 0.45) {
      const c = getCtx();
      const osc  = c.createOscillator();
      const gain = c.createGain();
      osc.connect(gain);
      gain.connect(c.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, startAt);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.55, startAt + duration);
      gain.gain.setValueAtTime(0, startAt);
      gain.gain.linearRampToValueAtTime(0.28, startAt + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, startAt + duration);
      osc.start(startAt);
      osc.stop(startAt + duration);
    }

    function playHalfTime() {
      const c = getCtx();
      chime(880, c.currentTime);
    }

    function playFiveMin() {
      const c = getCtx();
      chime(660, c.currentTime);
      chime(660, c.currentTime + 0.5);
    }

    function playEnd() {
      const c = getCtx();
      chime(660, c.currentTime);
      chime(550, c.currentTime + 0.5);
      chime(440, c.currentTime + 1.0);
    }

    // ── Wake Lock ──────────────────────────────────────────────────────────
    async function acquireWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
    }

    function releaseWakeLock() {
      wakeLock?.release();
      wakeLock = null;
    }

    document.addEventListener('visibilitychange', () => {
      if (running && document.visibilityState === 'visible') acquireWakeLock();
    });

    // ── UI helpers ─────────────────────────────────────────────────────────
    function fmt(s) {
      const m = Math.floor(s / 60);
      return `${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    function setRingFraction(f) {
      ring.style.strokeDashoffset = CIRC * (1 - Math.max(0, Math.min(1, f)));
    }

    function applyColor(rem, total) {
      let color;
      if (total === 0 || rem / total > 0.5) {
        color = getComputedStyle(document.documentElement).getPropertyValue('--blue').trim();
      } else if (rem > 300) {
        color = getComputedStyle(document.documentElement).getPropertyValue('--amber').trim();
      } else {
        color = getComputedStyle(document.documentElement).getPropertyValue('--red').trim();
      }
      ring.style.stroke = color;
      timeDisp.style.color = (rem / total > 0.5) ? '' : color;
    }

    let notifTimer;
    function showNotif(msg) {
      notif.textContent = msg;
      notif.classList.add('show');
      clearTimeout(notifTimer);
      notifTimer = setTimeout(() => notif.classList.remove('show'), 3200);
    }

    // ── Timer core ─────────────────────────────────────────────────────────
    function tick() {
      if (remaining <= 0) {
        end();
        return;
      }
      remaining--;
      updateView();

      // Half-time alert
      const halfPoint = Math.floor(totalSec / 2);
      if (!halfFired && remaining === halfPoint) {
        halfFired = true;
        showNotif('Half time');
        if (soundOn) playHalfTime();
      }

      // 5-minute alert (only when total > 5 min)
      if (!fiveFired && totalSec > 300 && remaining === 300) {
        fiveFired = true;
        showNotif('5 minutes remaining');
        if (soundOn) playFiveMin();
        btnStart.style.background = getComputedStyle(document.documentElement).getPropertyValue('--amber').trim();
      }
    }

    function updateView() {
      timeDisp.textContent = fmt(remaining);
      if (totalSec > 0) {
        setRingFraction(remaining / totalSec);
        applyColor(remaining, totalSec);
      }
    }

    function end() {
      clearInterval(timerId);
      running = false;
      remaining = 0;
      releaseWakeLock();
      timeDisp.textContent = '00:00';
      setRingFraction(0);
      ring.style.stroke = getComputedStyle(document.documentElement).getPropertyValue('--red').trim();
      timeDisp.style.color = getComputedStyle(document.documentElement).getPropertyValue('--red').trim();
      timeDisp.classList.add('pulsing');
      statusTxt.textContent = "Time's up";
      statusTxt.style.color = getComputedStyle(document.documentElement).getPropertyValue('--red').trim();
      btnPause.classList.add('hidden');
      btnStart.classList.add('hidden');
      if (soundOn) playEnd();
    }

    // ── Control actions ────────────────────────────────────────────────────
    function startFresh() {
      const m = Math.max(0, parseInt(inputMin.value) || 0);
      const s = Math.max(0, Math.min(59, parseInt(inputSec.value) || 0));
      totalSec = m * 60 + s;
      if (totalSec === 0) return;

      remaining = totalSec;
      halfFired = false;
      fiveFired = false;
      timeDisp.classList.remove('pulsing');
      timeDisp.style.color = '';
      ring.style.stroke = getComputedStyle(document.documentElement).getPropertyValue('--blue').trim();
      btnStart.style.background = '';
      statusTxt.style.color = '';
      updateView();
      beginCounting();
    }

    function beginCounting() {
      running = true;
      timerId = setInterval(tick, 1000);
      acquireWakeLock();
      setupRow.classList.add('hidden');
      btnStart.classList.add('hidden');
      btnPause.classList.remove('hidden');
      btnReset.classList.remove('hidden');
      statusTxt.textContent = 'Running';
    }

    function pause() {
      clearInterval(timerId);
      running = false;
      releaseWakeLock();
      btnPause.classList.add('hidden');
      btnStart.textContent = 'Resume';
      btnStart.classList.remove('hidden');
      statusTxt.textContent = 'Paused';
    }

    function resume() {
      btnStart.classList.add('hidden');
      btnStart.textContent = 'Start';
      beginCounting();
    }

    function reset() {
      clearInterval(timerId);
      running = false;
      remaining = 0;
      totalSec = 0;
      releaseWakeLock();
      timeDisp.classList.remove('pulsing');
      timeDisp.textContent = '00:00';
      timeDisp.style.color = '';
      statusTxt.textContent = '';
      statusTxt.style.color = '';
      ring.style.stroke = getComputedStyle(document.documentElement).getPropertyValue('--blue').trim();
      ring.style.transition = 'none';
      setRingFraction(1);
      requestAnimationFrame(() => {
        ring.style.transition = '';
      });
      btnStart.textContent = 'Start';
      btnStart.style.background = '';
      setupRow.classList.remove('hidden');
      btnStart.classList.remove('hidden');
      btnPause.classList.add('hidden');
      btnReset.classList.add('hidden');
    }

    // ── Events ─────────────────────────────────────────────────────────────
    btnStart.addEventListener('click', () => {
      getCtx(); // unlock audio on first gesture
      if (remaining > 0 && !running) resume();
      else startFresh();
    });

    btnPause.addEventListener('click', pause);
    btnReset.addEventListener('click', reset);

    document.getElementById('toggle').parentElement.addEventListener('click', () => {
      soundOn = !soundOn;
      toggleEl.classList.toggle('on', soundOn);
      toggleEl.setAttribute('aria-checked', soundOn);
    });

    // Keyboard: Enter on inputs starts timer
    [inputMin, inputSec].forEach(el => {
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') btnStart.click();
      });
    });

    // Clamp and pad inputs on blur
    inputMin.addEventListener('blur', () => {
      const v = Math.max(0, Math.min(99, parseInt(inputMin.value) || 0));
      inputMin.value = String(v).padStart(2, '0');
    });

    inputSec.addEventListener('blur', () => {
      const v = Math.max(0, Math.min(59, parseInt(inputSec.value) || 0));
      inputSec.value = String(v).padStart(2, '0');
    });

    // Keyboard shortcut: Space = start/pause/resume
    document.addEventListener('keydown', e => {
      if (e.target === inputMin || e.target === inputSec) return;
      if (e.code === 'Space') {
        e.preventDefault();
        if (running) pause();
        else if (remaining > 0) resume();
        else btnStart.click();
      }
      if (e.code === 'Escape' && (running || remaining > 0)) reset();
    });
  </script>
</body>
</html>
